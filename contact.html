<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Contact P. Likitha for software development and project opportunities.">

    <meta name="author"
          content="P. Likitha">

    <meta name="robots"
          content="index, follow">

    <title>Contact | P. Likitha</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<a class="skip-link"
   href="#main-content">
    Skip to main content
</a>

<header class="site-header">

    <nav class="navbar"
         aria-label="Primary navigation">

        <a href="index.html"
           class="logo">
            P. Likitha
        </a>

        <button class="menu-button"
                type="button"
                aria-expanded="false"
                aria-controls="main-menu"
                aria-label="Open navigation menu">
            ☰
        </button>

        <ul id="main-menu"
            class="nav-links">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="about.html">
                    About
                </a>
            </li>

            <li>
                <a href="projects.html">
                    Projects
                </a>
            </li>

            <li>
                <a href="contact.html"
                   aria-current="page">
                    Contact
                </a>
            </li>

        </ul>

    </nav>

</header>

<main id="main-content">

    <section class="section"
             aria-labelledby="contact-title">

        <h1 id="contact-title">
            Contact Me
        </h1>

        <p>
            Have a question or want to discuss a project?
            Send me a message using the form below.
        </p>

        <form class="contact-form"
              action="#"
              method="post"
              aria-describedby="form-description">

            <p id="form-description">
                All fields marked with an asterisk are required.
            </p>

            <div class="form-group">

                <label for="name">
                    Full Name
                    <span aria-hidden="true">*</span>
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    autocomplete="name"
                    required
                    aria-required="true"
                    placeholder="Enter your full name">

            </div>

            <div class="form-group">

                <label for="email">
                    Email Address
                    <span aria-hidden="true">*</span>
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                    aria-required="true"
                    placeholder="Enter your email address">

            </div>

            <div class="form-group">

                <label for="subject">
                    Subject
                    <span aria-hidden="true">*</span>
                </label>

                <input
                    type="text"
                    id="subject"
                    name="subject"
                    required
                    aria-required="true"
                    placeholder="Enter message subject">

            </div>

            <div class="form-group">

                <label for="message">
                    Message
                    <span aria-hidden="true">*</span>
                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    required
                    aria-required="true"
                    placeholder="Write your message">
                </textarea>

            </div>

            <button class="button"
                    type="submit">
                Send Message
            </button>

            <p id="form-status"
               class="form-status"
               role="status"
               aria-live="polite">
            </p>

        </form>

    </section>

</main>

<footer class="site-footer">

    <p>
        &copy; 2026 P. Likitha. All rights reserved.
    </p>

</footer>

<script src="js/script.js"></script>

</body>
</html>
